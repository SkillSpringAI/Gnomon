services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_agent
      POSTGRES_USER: research_agent
      POSTGRES_PASSWORD: research_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_agent -d research_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
